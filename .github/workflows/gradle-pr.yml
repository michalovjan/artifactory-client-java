name: Java CI with Gradle

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-gradle:
    if: github.repository == 'project-ncl/artifactory-client-java'
    uses: project-ncl/shared-github-actions/.github/workflows/gradle-ci.yml@461b242bf215856b94e7b40f1ecfa06f7ebb1b45 # v0.0.26
    with:
      java_version: "17"
      build_args: "--no-daemon --stacktrace clean build "
      upload_artifacts: true
