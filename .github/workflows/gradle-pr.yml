name: Java CI with Gradle

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-gradle:
    if: github.repository == 'project-ncl/artifactory-client-java'
    uses: project-ncl/shared-github-actions/.github/workflows/gradle-ci.yml@9735924b878ff3890cfaf16acb28e06531963ebf # v0.0.25
    with:
      java_version: "17"
      build_args: "--no-daemon --stacktrace clean build "
      upload_artifacts: true
